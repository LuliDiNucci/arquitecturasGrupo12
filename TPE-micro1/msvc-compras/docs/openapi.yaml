openapi: 3.0.3
info:
  title: TicketYa — Compras y Pagos
  version: 1.0.0
  description: >-
    Contrato REST relevado a partir de los endpoints y DTO del microservicio
    msvc-compras. Los códigos de respuesta exitosos corresponden a los
    contratos documentados. Las respuestas de error deben verificarse durante
    las pruebas de integración.
servers:
  - url: http://localhost:8082
    description: Entorno local

tags:
  - name: Compras
    description: Inicio, consulta y confirmación de compras.
  - name: Pagos
    description: Procesamiento de pagos.
  - name: Reintegros
    description: Gestión de reintegros y compensaciones.

paths:
  /compras:
    post:
      tags: [Compras]
      summary: Iniciar una compra a partir de una reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IniciarCompraDTO'
            example:
              clienteId: 10
              reservaId: 15
      responses:
        '201':
          description: Compra creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraDTO'

  /compras/{id}:
    get:
      tags: [Compras]
      summary: Consultar una compra
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: Compra encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraDTO'
        '404':
          description: Compra no encontrada.

  /compras/{id}/confirmar:
    post:
      tags: [Compras]
      summary: Confirmar una compra luego del pago aprobado
      description: >-
        Completa la confirmación de la reserva y solicita la emisión de las
        entradas. La compra solamente queda CONFIRMADA cuando se validan las
        entradas recibidas.
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: Resultado de la confirmación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraDTO'

  /compras/{id}/confirmacion:
    get:
      tags: [Compras]
      summary: Consultar el estado de confirmación de una compra
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: Información sobre la confirmación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmacionCompraDTO'

  /compras/{id}/pagar:
    post:
      tags: [Pagos]
      summary: Procesar el pago de una compra
      description: >-
        Procesa el pago mediante la pasarela simulada. Requiere una clave de
        idempotencia. Si la clave ya fue utilizada, se verifica que los datos
        de la solicitud coincidan con los del intento registrado.
      parameters:
        - $ref: '#/components/parameters/CompraId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcesarPagoDTO'
            example:
              medioPago: TARJETA
              claveIdempotencia: PAGO-1-001
      responses:
        '200':
          description: Resultado del procesamiento del pago.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoDTO'

  /compras/{id}/reintentar-liberacion:
    post:
      tags: [Compras]
      summary: Reintentar la liberación de una reserva
      description: >-
        Permite reintentar la liberación cuando el pago fue rechazado y la
        liberación de la reserva quedó pendiente.
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '204':
          description: Operación procesada sin contenido de respuesta.

  /compras/reintegros:
    post:
      tags: [Reintegros]
      summary: Solicitar el reintegro de una entrada
      description: >-
        Procesa el reintegro de una entrada luego de verificar su estado en
        el microservicio de Entradas y comprobar que corresponde a la compra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudReintegroDTO'
            example:
              entradaId: 25
              motivo: DEVOLUCION_CLIENTE
      responses:
        '200':
          description: Resultado del reintegro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReintegroDTO'

  /compras/{id}/reintegros:
    get:
      tags: [Reintegros]
      summary: Consultar los reintegros de una compra
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: Lista de reintegros asociados a la compra.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReintegroDTO'

  /compras/evento/{eventoId}/cancelar:
    post:
      tags: [Reintegros]
      summary: Procesar la cancelación de un evento
      description: >-
        Endpoint interno invocado por el microservicio de Eventos. Compras
        verifica que el evento esté cancelado, invalida sus entradas y procesa
        los reintegros correspondientes. El encabezado X-Operacion-Id se
        recibe y valida, pero actualmente no se utiliza para deduplicar la
        operación.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: X-Operacion-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Operación procesada sin contenido de respuesta.

  /compras/{id}/compensar:
    post:
      tags: [Reintegros]
      summary: Compensar una compra cuya reserva no pudo confirmarse
      description: >-
        Gestiona el reintegro de los importes cuando el pago fue aprobado,
        pero no se pudo completar la confirmación de la reserva. Verifica
        previamente que no se hayan emitido entradas para la compra.
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '204':
          description: Operación procesada sin contenido de respuesta.

components:
  parameters:
    CompraId:
      name: id
      in: path
      required: true
      description: Identificador de la compra.
      schema:
        type: integer
        format: int64

  schemas:
    IniciarCompraDTO:
      type: object
      required:
        - clienteId
        - reservaId
      properties:
        clienteId:
          type: integer
          format: int64
        reservaId:
          type: integer
          format: int64

    CompraDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        clienteId:
          type: integer
          format: int64
        reservaId:
          type: integer
          format: int64
        eventoId:
          type: integer
          format: int64
        fechaCompra:
          type: string
          format: date
        total:
          type: number
          format: double
          example: 70000.00
        estado:
          $ref: '#/components/schemas/EstadoCompra'
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleCompraDTO'

    DetalleCompraDTO:
      type: object
      properties:
        sectorId:
          type: integer
          format: int64
        cantidad:
          type: integer
          example: 2
        precioUnitario:
          type: number
          example: 35000.00
        subtotal:
          type: number
          example: 70000.00

    ConfirmacionCompraDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        clienteId:
          type: integer
          format: int64
        reservaId:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoCompra'
        pagoAprobado:
          type: boolean

    ProcesarPagoDTO:
      type: object
      required:
        - medioPago
        - claveIdempotencia
      properties:
        medioPago:
          type: string
          enum:
            - TARJETA
            - TRANSFERENCIA
            - BILLETERA
            - TARJETA_RECHAZADA
        claveIdempotencia:
          type: string
          maxLength: 160
          example: PAGO-1-001

    PagoDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        compraId:
          type: integer
          format: int64
        importe:
          type: number
          example: 70000.00
        medioPago:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoPago'
        fechaSolicitud:
          type: string
          format: date-time
        fechaPago:
          type: string
          format: date-time
          nullable: true
        referenciaExterna:
          type: string
          nullable: true

    SolicitudReintegroDTO:
      type: object
      required:
        - entradaId
      properties:
        entradaId:
          type: integer
          format: int64
        motivo:
          type: string
          example: DEVOLUCION_CLIENTE

    ReintegroDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        pagoId:
          type: integer
          format: int64
        compraId:
          type: integer
          format: int64
        entradaId:
          type: integer
          format: int64
          nullable: true
        importe:
          type: number
          example: 35000.00
        estado:
          $ref: '#/components/schemas/EstadoReintegro'
        motivo:
          type: string
        referenciaExterna:
          type: string
          nullable: true

    EstadoCompra:
      type: string
      enum:
        - PENDIENTE
        - CONFIRMACION_PENDIENTE
        - COMPENSACION_PENDIENTE
        - LIBERACION_PENDIENTE
        - CONFIRMADA
        - RECHAZADA
        - REINTEGRO_PARCIAL
        - REINTEGRADA

    EstadoPago:
      type: string
      enum:
        - PENDIENTE
        - PROCESANDO
        - APROBADO
        - RECHAZADO
        - ERROR

    EstadoReintegro:
      type: string
      enum:
        - PENDIENTE
        - PROCESANDO
        - APROBADO
        - RECHAZADO
        - ERROR