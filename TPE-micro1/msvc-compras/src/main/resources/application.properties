
# Nombre y puerto
spring.application.name=msvc-compras
server.port=8082

# Base de datos propia
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketya_compras?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Comunicacion entre microservicios
msvc.reservas.url=${RESERVAS_URL:http://localhost:8080}
msvc.eventos.url=${EVENTOS_URL:http://localhost:8081}
msvc.entradas.url=${ENTRADAS_URL:http://localhost:8083}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
