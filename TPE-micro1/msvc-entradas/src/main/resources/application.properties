
spring.application.name=msvc-entradas

# Puerto de Entradas
server.port=8083

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ticketya_entradas?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Comunicacion con otros microservicios
msvc.reservas.url=http://localhost:8080
msvc.compras.url=http://localhost:8084
