  /eventos/buscar:
    get:
      tags:
      - Eventos
      summary: Buscar eventos combinando filtros
      description: Por defecto incluye eventos PUBLICADO y AGOTADO. Si desde es posterior a hasta devuelve HTTP
        400.
      parameters:
      - name: tipo
        in: query
        required: false
        description: Tipo de evento
        schema:
          type: string
          enum:
          - RECITAL
          - FESTIVAL
          - TEATRO
          - DEPORTE
          - CONFERENCIA
          - OTRO
      - name: organizadorId
        in: query
        required: false
        description: ID del organizador
        schema:
          type: integer
          format: int64
      - name: participanteId
        in: query
        required: false
        description: ID del participante
        schema:
          type: integer
          format: int64
      - name: ciudad
        in: query
        required: false
        description: Ciudad del lugar
        schema:
          type: string
      - name: desde
        in: query
        required: false
        description: Límite inferior de fecha/hora ISO
        schema:
          type: string
          format: date-time
      - name: hasta
        in: query
        required: false
        description: Límite superior de fecha/hora ISO
        schema:
          type: string
          format: date-time
      - name: q
        in: query
        required: false
        description: Texto en nombre, descripción, organizador o participante
        schema:
          type: string
      - name: ordenar
        in: query
        required: false
        description: Criterio de ordenamiento
        schema:
          type: string
          enum:
          - FECHA_ASC
          - FECHA_DESC
          - PRECIO_ASC
          - PRECIO_DESC
          - RELEVANCIA
          default: FECHA_ASC
      - name: incluirNoPublicados
        in: query
        required: false
        description: Incluir eventos no publicados (uso administrativo)
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoResumenResponseDTO'
        '400':
