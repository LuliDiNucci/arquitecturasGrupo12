components:
  schemas:
    ApiErrorResponseDTO:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
          example: 409
        error:
          type: string
          example: Conflict
        mensaje:
          type: string
          example: Faltan precios de uno o mas sectores del evento
        path:
          type: string
          example: /eventos/1/publicar
        detalles:
          type: array
          items:
            type: string
    LugarRequestDTO:
      type: object
      properties:
        nombre:
          type: string
          example: Estadio Municipal
          minLength: 1
        direccion:
          type: string
          example: Av. Central 150
          minLength: 1
        ciudad:
          type: string
          example: Tandil
          minLength: 1
        latitud:
          type: number
          example: -37.321
        longitud:
          type: number
          example: -59.137
      required:
      - nombre
      - direccion
      - ciudad
      - latitud
      - longitud
    LugarResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Estadio Municipal
        direccion:
          type: string
          example: Av. Central 150
        ciudad:
          type: string
          example: Tandil
        latitud:
          type: number
          example: -37.321
        longitud:
          type: number
          example: -59.137
    SectorRequestDTO:
      type: object
      properties:
        nombre:
          type: string
          example: Platea
          minLength: 1
        numerado:
          type: boolean
          example: true
        capacidad:
          type: integer
          format: int32
          example: 2
          minimum: 1
      required:
      - nombre
    SectorResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        lugarId:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Platea
        numerado:
          type: boolean
          example: true
        capacidad:
          type: integer
          format: int32
          example: 2
        asientosCargados:
          type: integer
          format: int64
          example: 2
    AsientoRequestDTO:
      type: object
      properties:
        fila:
          type: string
          example: A
          minLength: 1
        numero:
          type: integer
          format: int32
          example: 1
          minimum: 1
      required:
      - fila
    AsientosRequestDTO:
      type: object
      properties:
        asientos:
          type: array
          items:
            $ref: '#/components/schemas/AsientoRequestDTO'
      required:
      - asientos
    AsientoResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        fila:
          type: string
          example: A
        numero:
          type: integer
          format: int32
          example: 1
        sectorId:
          type: integer
          format: int64
          example: 1
    OrganizadorRequestDTO:
      type: object
      properties:
        nombre:
          type: string
          example: Producciones Sierra
          minLength: 1
        email:
          type: string
          example: contacto@ejemplo.com
          minLength: 1
      required:
      - nombre
      - email
    OrganizadorResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Producciones Sierra
        email:
          type: string
          example: contacto@ejemplo.com
    ParticipanteRequestDTO:
      type: object
      properties:
        nombre:
          type: string
          example: Banda Ejemplo
          minLength: 1
        tipo:
          type: string
          enum:
          - ARTISTA
          - EQUIPO
          - DISERTANTE
          - OTRO
          example: ARTISTA
      required:
      - nombre
      - tipo
    ParticipanteResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Banda Ejemplo
        tipo:
          type: string
          enum:
          - ARTISTA
          - EQUIPO
          - DISERTANTE
          - OTRO
          example: ARTISTA
    EventoRequestDTO:
      type: object
      properties:
        nombre:
          type: string
          example: Recital de prueba
          minLength: 1
        descripcion:
          type: string
          example: Evento para probar TicketYa
          minLength: 1
        tipo:
          type: string
          enum:
          - RECITAL
          - FESTIVAL
          - TEATRO
          - DEPORTE
          - CONFERENCIA
          - OTRO
          example: RECITAL
        organizadorId:
          type: integer
          format: int64
          example: 1
        lugarId:
          type: integer
          format: int64
          example: 1
        fechaHora:
          type: string
          format: date-time
          example: '2027-12-20T21:00:00'
        participantesIds:
          type: array
          items:
            type: integer
            format: int64
        altaDemanda:
          type: boolean
          example: false
      required:
      - nombre
      - descripcion
      - tipo
      - organizadorId
      - lugarId
      - fechaHora
      - participantesIds
    EventoResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Recital de prueba
        descripcion:
          type: string
          example: Presentacion en vivo
        tipo:
          type: string
          enum:
          - RECITAL
          - FESTIVAL
          - TEATRO
          - DEPORTE
          - CONFERENCIA
          - OTRO
          example: RECITAL
        estado:
          type: string
          enum:
          - BORRADOR
          - PUBLICADO
          - AGOTADO
          - SUSPENDIDO
          - CANCELADO
          - FINALIZADO
          example: PUBLICADO
        organizador:
          $ref: '#/components/schemas/OrganizadorResponseDTO'
        participantes:
          type: array
          items:
            $ref: '#/components/schemas/ParticipanteResponseDTO'
        fechaHora:
          type: string
          format: date-time
          example: '2027-12-20T21:00:00'
        lugar:
          $ref: '#/components/schemas/LugarResponseDTO'
        altaDemanda:
          type: boolean
          example: false
        sectores:
          type: array
          items:
            $ref: '#/components/schemas/PrecioSectorResponseDTO'
        version:
          type: integer
          format: int64
          example: 0
    EventoResumenResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Recital de prueba
        tipo:
          type: string
          enum:
          - RECITAL
          - FESTIVAL
          - TEATRO
          - DEPORTE
          - CONFERENCIA
          - OTRO
          example: RECITAL
        estado:
          type: string
          enum:
          - BORRADOR
          - PUBLICADO
          - AGOTADO
          - SUSPENDIDO
          - CANCELADO
          - FINALIZADO
          example: PUBLICADO
        fechaHora:
          type: string
          format: date-time
          example: '2027-12-20T21:00:00'
        ciudad:
          type: string
          example: Tandil
        lugar:
          type: string
          example: Estadio Municipal
        organizador:
          type: string
          example: Producciones Sierra
        precioDesde:
          type: number
          example: 35000.0
          nullable: true
        altaDemanda:
          type: boolean
          example: false
    PrecioSectorRequestDTO:
      type: object
      properties:
        sectorId:
          type: integer
          format: int64
          example: 1
        precio:
          type: number
          example: 35000.0
      required:
      - sectorId
      - precio
    PreciosEventoRequestDTO:
      type: object
      properties:
        precios:
          type: array
          items:
            $ref: '#/components/schemas/PrecioSectorRequestDTO'
      required:
      - precios
    PrecioSectorResponseDTO:
      type: object
      properties:
        sectorId:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Platea
        numerado:
          type: boolean
          example: true
        capacidad:
          type: integer
          format: int32
          example: 2
        precio:
          type: number
          example: 35000.0
        asientos:
          type: array
          items:
            $ref: '#/components/schemas/AsientoResponseDTO'
    PrecioSectorIndividualDTO:
      type: object
      properties:
        eventoId:
          type: integer
          format: int64
        sectorId:
          type: integer
          format: int64
        precio:
          type: number
    HabilitacionEventoResponseDTO:
      type: object
      properties:
        eventoId:
          type: integer
          format: int64
          example: 1
        estado:
          type: string
          enum:
          - BORRADOR
          - PUBLICADO
          - AGOTADO
          - SUSPENDIDO
          - CANCELADO
          - FINALIZADO
          example: PUBLICADO
        habilitadoParaReservar:
          type: boolean
          example: true
        fechaHora:
          type: string
          format: date-time
          example: '2027-12-20T21:00:00'
    EstadoNotificacionesResponseDTO:
      type: object
      properties:
        eventoId:
          type: integer
          format: int64
          example: 1
        reservasNotificadas:
          type: boolean
          example: false
        entradasNotificadas:
          type: boolean
          example: false
        comprasNotificadas:
          type: boolean
          example: false
        intentos:
          type: integer
          format: int32
          example: 0
        ultimoError:
          type: string
          nullable: true
