# OpenAPI 3.0.3 - TicketYa
openapi: 3.0.3
info:
  title: TicketYa - API de Eventos y Lugares
  version: 1.0.0
  description: Contrato REST de msvc-eventosylugares, elaborado a partir de los controladores, DTO y validaciones
    del proyecto.
servers:
- url: http://localhost:8081
  description: Servicio local
- url: http://localhost:8084
  description: Acceso por Gateway 
tags:
- name: Eventos
- name: Lugares
- name: Sectores
- name: Asientos
- name: Organizadores
- name: Participantes
paths:
  /lugares:
    post:
      tags:
      - Lugares
      summary: Crear lugar con ciudad y coordenadas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LugarRequestDTO'
            example:
              nombre: Estadio Municipal
              direccion: Av. Central 150
              ciudad: Tandil
              latitud: -37.321
              longitud: -59.137
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LugarResponseDTO'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '409':
          description: Conflicto o regla de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
    get:
      tags:
      - Lugares
      summary: Listar lugares
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LugarResponseDTO'
        '400':
          description: Solicitud inválida
          content:
            application/json:
