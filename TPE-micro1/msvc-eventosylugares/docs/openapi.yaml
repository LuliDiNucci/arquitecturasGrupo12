              $ref: '#/components/schemas/EventoRequestDTO'
            example:
              nombre: Recital de prueba
              descripcion: Evento para probar TicketYa
              tipo: RECITAL
              organizadorId: 1
              lugarId: 1
              fechaHora: '2027-12-20T21:00:00'
              participantesIds:
              - 1
              altaDemanda: false
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
