spring:
  datasource:
    url: jdbc:h2:mem:ticketya_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  task:
    scheduling:
      enabled: false

app:
  integraciones:
    habilitadas: false
    reservas-base-url: http://localhost:8082
    entradas-base-url: http://localhost:8083
    compras-base-url: http://localhost:8084