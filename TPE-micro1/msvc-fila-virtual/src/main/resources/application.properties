spring.application.name=msvc-fila-virtual
server.port=8086

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/ticketya_fila_virtual?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Comunicacion con Eventos y Lugares
msvc.eventos.url=${EVENTOS_URL:http://localhost:8081}

spring.cloud.openfeign.client.config.eventosClient.connectTimeout=3000
spring.cloud.openfeign.client.config.eventosClient.readTimeout=5000