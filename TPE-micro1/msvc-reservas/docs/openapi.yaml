openapi: 3.0.3
info:
  title: TicketYa - Reservas
  version: 1.0.0
  description: >-
    Contrato propuesto de msvc-reservas para entrega 1. Los endpoints de cambio de estado
    son internos; en entrega 1 sin JWT deben restringirse mediante el gateway/red.
servers:
  - url: http://localhost:8080
paths:
  /reservas:
    post:
      summary: Crear reserva temporal de 10 minutos
      description: Clave de idempotencia obligatoria; el cliente se identifica por clienteId en la entrega 1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearReserva' }
            example:
              clienteId: 1
              eventoId: 20
              claveIdempotencia: req-001
              detalles:
                - sectorId: 5
                  cantidad: 1
                  asientoIds: [25]
      responses:
        '201':
          description: Reserva creada o solicitud idempotente repetida (respuesta existente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reserva' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /reservas/{id}:
    get:
      summary: Consultar reserva por ID
      parameters: [ { $ref: '#/components/parameters/ReservaId' } ]
      responses:
        '200':
          description: Reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reserva' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reservas/{id}/confirmar:
    post:
      summary: Confirmar reserva desde Compras (interno)
      parameters: [ { $ref: '#/components/parameters/ReservaId' } ]
      responses:
        '200': { $ref: '#/components/responses/ReservaOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reservas/{id}/liberar:
    post:
      summary: Liberar reserva temporal por pago rechazado (interno)
      parameters: [ { $ref: '#/components/parameters/ReservaId' } ]
      responses:
        '200': { $ref: '#/components/responses/ReservaOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reservas/evento/{eventoId}/habilitar:
    post:
      summary: Habilitar un evento para recibir reservas (interno)
      description: >-
        Operación invocada por msvc-eventos-lugares antes de iniciar
        las ventas. Verifica que el evento exista, esté PUBLICADO
        y no haya sido cancelado. Es idempotente.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Evento habilitado correctamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /reservas/evento/{eventoId}/cancelar:
    post:
      summary: Cancelar reservas activas y bloquear ventas futuras (interno)
      description: No genera reintegros; los coordina Compras/Entradas. Estado cancelado local persistente.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Cancelación local aplicada }
        '409': { $ref: '#/components/responses/Conflict' }
  /reservas/{id}/devolver-entrada:
    post:
      summary: Liberar una entrada tras devolución aprobada (interno)
      description: El servicio que invoca debe verificar previamente titularidad, aprobación y regla de 72 horas.
      parameters: [ { $ref: '#/components/parameters/ReservaId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevolverEntrada' }
            example: { entradaId: 102, sectorId: 5, asientoId: 25 }
      responses:
        '200': { $ref: '#/components/responses/ReservaOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /disponibilidad:
    get:
      summary: Consultar disponibilidad actual (no reservar)
      parameters:
        - name: eventoId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: sectorId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Lugares libres a la hora de la consulta; pueden cambiar inmediatamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disponibilidad' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  parameters:
    ReservaId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    DetallePedido:
      type: object
      required: [sectorId, cantidad]
      properties:
        sectorId: { type: integer, format: int64 }
        cantidad: { type: integer, minimum: 1 }
        asientoIds: { type: array, items: { type: integer, format: int64 } }
    CrearReserva:
      type: object
      required: [clienteId, eventoId, claveIdempotencia, detalles]
      properties:
        clienteId: { type: integer, format: int64 }
        eventoId: { type: integer, format: int64 }
        claveIdempotencia: { type: string, maxLength: 160 }
        detalles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DetallePedido' } }
    DevolverEntrada:
      type: object
      required: [entradaId, sectorId]
      properties:
        entradaId: { type: integer, format: int64 }
        sectorId: { type: integer, format: int64 }
        asientoId: { type: integer, format: int64, nullable: true }
    DetalleReserva:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sectorId: { type: integer, format: int64 }
        cantidad: { type: integer }
        cantidadLiberada: { type: integer }
        asientoIds:
          type: array
          description: Asientos aún ocupados (no incluye los liberados)
          items: { type: integer, format: int64 }
    Reserva:
      type: object
      properties:
        id: { type: integer, format: int64 }
        clienteId: { type: integer, format: int64 }
        eventoId: { type: integer, format: int64 }
        fechaCreacion: { type: string, format: date-time }
        fechaVencimiento: { type: string, format: date-time }
        estado: { type: string, enum: [ACTIVA, CONFIRMADA, VENCIDA, LIBERADA, CANCELADA] }
        detalles:
          type: array
          items: { $ref: '#/components/schemas/DetalleReserva' }
    Disponibilidad:
      type: object
      properties:
        eventoId: { type: integer, format: int64 }
        sectorId: { type: integer, format: int64 }
        lugaresDisponibles: { type: integer }
        asientosDisponibles:
          type: array
          items: { type: integer, format: int64 }

      asientosOcupados:
        type: array
        description: >-
          IDs de los asientos ocupados por reservas activas
          no vencidas o confirmadas. En sectores no numerados
          se devuelve una lista vacía.
        items:
          type: integer
          format: int64
        example: [25]

    Error:
      type: object
      properties:
        estado: { type: integer }
        mensaje: { type: string }
  responses:
    ReservaOk:
      description: Reserva actualizada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Reserva' }
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicto de disponibilidad o de estado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Falló dependencia remota
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
