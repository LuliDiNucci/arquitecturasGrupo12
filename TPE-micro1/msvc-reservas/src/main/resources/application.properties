
# Nombre del microservicio
spring.application.name=msvc-reservas

# Puerto del microservicio Reservas
server.port=8080

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ticketya_reservas?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Limite de entradas por cliente
reservas.max-entradas-por-cliente=4

# Conexion con el microservicio Eventos y Lugares
msvc.eventos.url=http://localhost:8081

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
