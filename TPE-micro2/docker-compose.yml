name: ticketya
x-jwt: &jwt
  JWT_PUBLIC_KEY: file:/run/secrets/jwt-public.pem
  JWT_ISSUER: ticketya-usuarios
  JWT_AUDIENCE: ticketya-api
  TICKETYA_LOG_DIR: /var/log/ticketya
services:
  # El colector puede montar primero el volumen vacío. Fijar su propietario antes
  # de iniciar Java evita depender del orden de creación de los contenedores.
  logs-init:
    image: eclipse-temurin:21-jre
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R 10001:10001 /var/log/ticketya && chmod 0755 /var/log/ticketya"]
    volumes:
      - application-logs:/var/log/ticketya
    restart: "no"
  db-usuarios:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure .env}
      MYSQL_DATABASE: ticketya_usuarios
      MYSQL_USER: ticketya
      MYSQL_PASSWORD: ${USUARIOS_DB_PASSWORD:?Configure .env}
    ports: ["127.0.0.1:3327:3306"]
    volumes: ["db-usuarios:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  db-eventos:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure .env}
      MYSQL_DATABASE: ticketya_eventos
      MYSQL_USER: ticketya
      MYSQL_PASSWORD: ${EVENTOS_DB_PASSWORD:?Configure .env}
    ports: ["127.0.0.1:3308:3306"]
    volumes: ["db-eventos:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  db-reservas:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure .env}
      MYSQL_DATABASE: ticketya_reservas
      MYSQL_USER: ticketya
      MYSQL_PASSWORD: ${RESERVAS_DB_PASSWORD:?Configure .env}
    ports: ["127.0.0.1:3309:3306"]
    volumes: ["db-reservas:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  db-compras:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure .env}
      MYSQL_DATABASE: ticketya_compras
      MYSQL_USER: ticketya
      MYSQL_PASSWORD: ${COMPRAS_DB_PASSWORD:?Configure .env}
    ports: ["127.0.0.1:3310:3306"]
    volumes: ["db-compras:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  db-notificaciones:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure .env}
      MYSQL_DATABASE: ticketya_notificaciones
      MYSQL_USER: ticketya
      MYSQL_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:?Configure .env}
    ports: ["127.0.0.1:3313:3306"]
    volumes: ["db-notificaciones:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
  db-fila-virtual:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure .env}
      MYSQL_DATABASE: ticketya_fila_virtual
      MYSQL_USER: ticketya
      MYSQL_PASSWORD: ${FILA_VIRTUAL_DB_PASSWORD:?Configure .env}
    ports:
      - "127.0.0.1:3312:3306"
    volumes:
      - db-fila-virtual:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  db-entradas:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure .env}
      MYSQL_DATABASE: ticketya_entradas
      MYSQL_USER: ticketya
      MYSQL_PASSWORD: ${ENTRADAS_DB_PASSWORD:?Configure .env}
    ports: ["127.0.0.1:3311:3306"]
    volumes: ["db-entradas:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  db-recomendaciones:
    image: mongo:8.0
    container_name: ticketya-db-recomendaciones
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - db-recomendaciones:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  usuarios:
    build:
      context: .
      dockerfile: msvc-usuarios/Dockerfile
    environment:
      <<: *jwt
      PORT: 8085
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://db-usuarios:3306/ticketya_usuarios?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ticketya
      DB_USERNAME: ticketya
      DB_PASSWORD: ${USUARIOS_DB_PASSWORD:?Configure .env}
      JWT_PRIVATE_KEY: file:/run/secrets/jwt-private.pem
      SERVICE_EVENTOS_SECRET: ${SERVICE_EVENTOS_SECRET:?Configure .env}
      SERVICE_RESERVAS_SECRET: ${SERVICE_RESERVAS_SECRET:?Configure .env}
      SERVICE_COMPRAS_SECRET: ${SERVICE_COMPRAS_SECRET:?Configure .env}
      SERVICE_ENTRADAS_SECRET: ${SERVICE_ENTRADAS_SECRET:?Configure .env}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      EVENTOS_URL: http://eventos:8081
      RESERVAS_URL: http://reservas:8080
      COMPRAS_URL: http://compras:8082
      ENTRADAS_URL: http://entradas:8083
    ports: ["8085:8085"]
    volumes:
      - ./.secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - application-logs:/var/log/ticketya
      - ./.secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
    depends_on:
      logs-init:
        condition: service_completed_successfully
      db-usuarios:
        condition: service_healthy
  eventos:
    build:
      context: .
      dockerfile: msvc-eventosylugares/Dockerfile
    environment:
      <<: *jwt
      PORT: 8081
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://db-eventos:3306/ticketya_eventos?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ticketya
      DB_USERNAME: ticketya
      DB_PASSWORD: ${EVENTOS_DB_PASSWORD:?Configure .env}
      SERVICE_CLIENT_SECRET: ${SERVICE_EVENTOS_SECRET:?Configure .env}
      SERVICE_TOKEN_URL: http://usuarios:8085/auth/service-token
      USUARIOS_URL: http://usuarios:8085
      RESERVAS_URL: http://reservas:8080
      COMPRAS_URL: http://compras:8082
      ENTRADAS_URL: http://entradas:8083
      NOTIFICACIONES_URL: http://notificaciones:8087
      RECOMENDACIONES_URL: http://recomendaciones:8086
    ports: ["8081:8081"]
    volumes:
      - ./.secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - application-logs:/var/log/ticketya
    depends_on:
      logs-init:
        condition: service_completed_successfully
      db-eventos:
        condition: service_healthy
      usuarios:
        condition: service_started
  reservas:
    build:
      context: .
      dockerfile: msvc-reservas/Dockerfile
    environment:
      <<: *jwt
      PORT: 8080
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:mysql://db-reservas:3306/ticketya_reservas?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ticketya
      DB_USERNAME: ticketya
      DB_PASSWORD: ${RESERVAS_DB_PASSWORD:?Configure .env}
      SERVICE_CLIENT_SECRET: ${SERVICE_RESERVAS_SECRET:?Configure .env}
      SERVICE_TOKEN_URL: http://usuarios:8085/auth/service-token
      FILA_VIRTUAL_URL: http://fila-virtual:8088
      USUARIOS_URL: http://usuarios:8085
      EVENTOS_URL: http://eventos:8081
      COMPRAS_URL: http://compras:8082
      ENTRADAS_URL: http://entradas:8083
    ports: ["8080:8080"]
    volumes:
      - ./.secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - application-logs:/var/log/ticketya
    depends_on:
      logs-init:
        condition: service_completed_successfully
      db-reservas:
        condition: service_healthy
      usuarios:
        condition: service_started
  recomendaciones:
    build:
      context: .
      dockerfile: msvc-recomendaciones/Dockerfile
    environment:
      <<: *jwt
      PORT: 8086
      MONGODB_URI: mongodb://db-recomendaciones:27017/ticketya_recomendaciones
      EVENTOS_URL: http://eventos:8081
      COMPRAS_URL: http://compras:8082
    ports:
      - "8086:8086"
    volumes:
      - ./.secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - application-logs:/var/log/ticketya
    depends_on:
      logs-init:
        condition: service_completed_successfully
      db-recomendaciones:
        condition: service_healthy
      eventos:
        condition: service_started
  fila-virtual:
    build:
      context: .
      dockerfile: msvc-fila-virtual/Dockerfile
    environment:
      <<: *jwt
      PORT: 8088
      DB_URL: jdbc:mysql://db-fila-virtual:3306/ticketya_fila_virtual?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ticketya
      DB_PASSWORD: ${FILA_VIRTUAL_DB_PASSWORD:?Configure .env}
      EVENTOS_URL: http://eventos:8081
    ports:
      - "8088:8088"
    volumes:
      - ./.secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - application-logs:/var/log/ticketya
    depends_on:
      logs-init:
        condition: service_completed_successfully
      db-fila-virtual:
        condition: service_healthy
      eventos:
        condition: service_started
  compras:
    build:
      context: .
      dockerfile: msvc-compras/Dockerfile
    environment:
      <<: *jwt
      PORT: 8082
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:mysql://db-compras:3306/ticketya_compras?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ticketya
      DB_USERNAME: ticketya
      DB_PASSWORD: ${COMPRAS_DB_PASSWORD:?Configure .env}
      SERVICE_CLIENT_SECRET: ${SERVICE_COMPRAS_SECRET:?Configure .env}
      SERVICE_TOKEN_URL: http://usuarios:8085/auth/service-token
      USUARIOS_URL: http://usuarios:8085
      EVENTOS_URL: http://eventos:8081
      FILA_VIRTUAL_URL: http://fila-virtual:8088
      RESERVAS_URL: http://reservas:8080
      ENTRADAS_URL: http://entradas:8083
      NOTIFICACIONES_URL: http://notificaciones:8087
    ports: ["8082:8082"]
    volumes:
      - ./.secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - application-logs:/var/log/ticketya
    depends_on:
      logs-init:
        condition: service_completed_successfully
      db-compras:
        condition: service_healthy
      usuarios:
        condition: service_started
  notificaciones:
    build:
      context: .
      dockerfile: msvc-notificaciones/Dockerfile
    environment:
      <<: *jwt
      PORT: 8087
      DB_URL: jdbc:mysql://db-notificaciones:3306/ticketya_notificaciones?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ticketya
      DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:?Configure .env}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: notificaciones@ticketya.test
    ports: ["8087:8087"]
    volumes:
      - ./.secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - application-logs:/var/log/ticketya
    depends_on:
      logs-init:
        condition: service_completed_successfully
      db-notificaciones:
        condition: service_healthy
      mailpit:
        condition: service_started
  entradas:
    build:
      context: .
      dockerfile: msvc-entradas/Dockerfile
    environment:
      <<: *jwt
      PORT: 8083
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:mysql://db-entradas:3306/ticketya_entradas?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ticketya
      DB_USERNAME: ticketya
      DB_PASSWORD: ${ENTRADAS_DB_PASSWORD:?Configure .env}
      SERVICE_CLIENT_SECRET: ${SERVICE_ENTRADAS_SECRET:?Configure .env}
      SERVICE_TOKEN_URL: http://usuarios:8085/auth/service-token
      USUARIOS_URL: http://usuarios:8085
      EVENTOS_URL: http://eventos:8081
      RESERVAS_URL: http://reservas:8080
      COMPRAS_URL: http://compras:8082
    ports: ["8083:8083"]
    volumes:
      - ./.secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - application-logs:/var/log/ticketya
    depends_on:
      logs-init:
        condition: service_completed_successfully
      db-entradas:
        condition: service_healthy
      usuarios:
        condition: service_started
  gateway:
    build:
      context: .
      dockerfile: msvc-gateway/Dockerfile
    environment:
      <<: *jwt
      PORT: 8084
      USUARIOS_URL: http://usuarios:8085
      EVENTOS_URL: http://eventos:8081
      RESERVAS_URL: http://reservas:8080
      COMPRAS_URL: http://compras:8082
      ENTRADAS_URL: http://entradas:8083
      FILA_VIRTUAL_URL: http://fila-virtual:8088
      RECOMENDACIONES_URL: http://recomendaciones:8086
      NOTIFICACIONES_URL: http://notificaciones:8087
    ports: ["8084:8084"]
    volumes:
      - ./.secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - application-logs:/var/log/ticketya
    depends_on:
      logs-init:
        condition: service_completed_successfully
      usuarios:
        condition: service_started
volumes:
  application-logs:
  db-usuarios:
  db-eventos:
  db-reservas:
  db-compras:
  db-entradas:
  db-recomendaciones:
  db-fila-virtual:
  db-notificaciones:
