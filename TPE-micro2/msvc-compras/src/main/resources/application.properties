
# Nombre y puerto
spring.application.name=msvc-compras
server.port=${PORT:8082}

# Base de datos propia
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketya_compras?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Comunicacion entre microservicios
msvc.reservas.url=${RESERVAS_URL:http://localhost:8080}
msvc.eventos.url=${EVENTOS_URL:http://localhost:8081}
msvc.entradas.url=${ENTRADAS_URL:http://localhost:8083}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Validación local de JWT y autenticación para llamadas internas.
ticketya.jwt.public-key=${JWT_PUBLIC_KEY:file:../.secrets/jwt-public.pem}
ticketya.jwt.issuer=${JWT_ISSUER:ticketya-usuarios}
ticketya.jwt.audience=${JWT_AUDIENCE:ticketya-api}
ticketya.service.secret=${SERVICE_CLIENT_SECRET:}
ticketya.service.token-url=${SERVICE_TOKEN_URL:http://localhost:8085/auth/service-token}
