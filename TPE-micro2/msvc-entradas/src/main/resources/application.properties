
spring.application.name=msvc-entradas

# Puerto de Entradas
server.port=${PORT:8083}

# Conexion a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketya_entradas?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:${DB_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Comunicacion con otros microservicios
msvc.reservas.url=${RESERVAS_URL:http://localhost:8080}
msvc.compras.url=${COMPRAS_URL:http://localhost:8082}

msvc.eventos.url=${EVENTOS_URL:http://localhost:8081}

# Validación local de JWT y autenticación para llamadas internas.
ticketya.jwt.public-key=${JWT_PUBLIC_KEY:file:../.secrets/jwt-public.pem}
ticketya.jwt.issuer=${JWT_ISSUER:ticketya-usuarios}
ticketya.jwt.audience=${JWT_AUDIENCE:ticketya-api}
ticketya.service.secret=${SERVICE_CLIENT_SECRET:}
ticketya.service.token-url=${SERVICE_TOKEN_URL:http://localhost:8085/auth/service-token}
