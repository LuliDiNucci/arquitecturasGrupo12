server:
  port: ${PORT:8081}

spring:
  config:
    import: classpath:ticketya-logging.properties
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  application:
    name: msvc-eventos-lugares
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/ticketya_eventos}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  integraciones:
    habilitadas: ${INTEGRACIONES_HABILITADAS:true}

    reservas-base-url: ${RESERVAS_URL:http://localhost:8080}
    entradas-base-url: ${ENTRADAS_URL:http://localhost:8083}
    compras-base-url: ${COMPRAS_URL:http://localhost:8082}
    usuarios-base-url: ${USUARIOS_URL:http://localhost:8085}
    notificaciones-base-url: ${NOTIFICACIONES_URL:http://localhost:8087}

    entradas-habilitadas: ${ENTRADAS_HABILITADAS:true}
    compras-habilitadas: ${COMPRAS_HABILITADAS:true}

    reintento-ms: 30000

ticketya:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:file:../.secrets/jwt-public.pem}
    issuer: ${JWT_ISSUER:ticketya-usuarios}
    audience: ${JWT_AUDIENCE:ticketya-api}
  service:
    secret: ${SERVICE_CLIENT_SECRET:}
    token-url: ${SERVICE_TOKEN_URL:http://localhost:8085/auth/service-token}
