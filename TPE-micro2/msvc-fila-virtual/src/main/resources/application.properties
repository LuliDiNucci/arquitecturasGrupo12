spring.application.name=msvc-fila-virtual

# Puerto
server.port=${PORT:8088}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketya_fila_virtual?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Comunicacion con Eventos y Lugares
msvc.eventos.url=${EVENTOS_URL:http://localhost:8081}

# Configuracion de Feign
spring.cloud.openfeign.client.config.eventosClient.connectTimeout=3000
spring.cloud.openfeign.client.config.eventosClient.readTimeout=5000

# Seguridad JWT
ticketya.jwt.public-key=${JWT_PUBLIC_KEY:file:../.secrets/jwt-public.pem}
ticketya.jwt.issuer=${JWT_ISSUER:ticketya-usuarios}
ticketya.jwt.audience=${JWT_AUDIENCE:ticketya-api}