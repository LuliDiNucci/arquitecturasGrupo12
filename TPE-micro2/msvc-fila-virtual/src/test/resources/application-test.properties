# Reproducible sin MySQL local; permite repetir las mismas pruebas contra MySQL.
spring.datasource.url=${FILA_TEST_DB_URL:jdbc:h2:mem:fila_test;DB_CLOSE_DELAY=-1;MODE=MySQL;LOCK_TIMEOUT=10000}
spring.datasource.driver-class-name=${FILA_TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${FILA_TEST_DB_USER:sa}
spring.datasource.password=${FILA_TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
