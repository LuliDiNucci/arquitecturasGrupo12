spring.application.name=msvc-notificaciones
server.port=${PORT:8085}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketya_notificaciones?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.notificaciones.remitente=${MAIL_FROM:notificaciones@ticketya.test}
app.notificaciones.intervalo-ms=${NOTIFICACIONES_INTERVALO_MS:1000}
app.notificaciones.max-intentos=${NOTIFICACIONES_MAX_INTENTOS:3}
app.notificaciones.reintento-segundos=${NOTIFICACIONES_REINTENTO_SEGUNDOS:10}

spring.mvc.problemdetails.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
