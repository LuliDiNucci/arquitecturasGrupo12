spring.application.name=msvc-recomendaciones

server.port=8086

# MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ticketya_recomendaciones}
# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

app.eventos.url=${EVENTOS_URL:http://localhost:8081}

# Seguridad JWT
ticketya.jwt.public-key=${JWT_PUBLIC_KEY:file:../.secrets/jwt-public.pem}
ticketya.jwt.issuer=${JWT_ISSUER:ticketya-usuarios}
ticketya.jwt.audience=${JWT_AUDIENCE:ticketya-api}
app.compras.url=${COMPRAS_URL:http://localhost:8082}
spring.cloud.openfeign.client.config.default.connectTimeout=${FEIGN_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.default.readTimeout=${FEIGN_READ_TIMEOUT_MS:5000}
spring.cloud.openfeign.client.config.msvc-eventos.connectTimeout=${RECOMENDACIONES_EVENTOS_CONNECT_TIMEOUT_MS:1000}
spring.cloud.openfeign.client.config.msvc-eventos.readTimeout=${RECOMENDACIONES_EVENTOS_READ_TIMEOUT_MS:1500}
