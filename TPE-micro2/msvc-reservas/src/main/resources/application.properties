spring.config.import=classpath:ticketya-logging.properties

# Nombre del microservicio
spring.application.name=msvc-reservas

# Puerto del microservicio Reservas
server.port=${PORT:8080}

# Conexion a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketya_reservas?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:${DB_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Limite de entradas por cliente
reservas.max-entradas-por-cliente=4

# Conexion con el microservicio Eventos y Lugares
msvc.eventos.url=${EVENTOS_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.default.connectTimeout=${FEIGN_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.default.readTimeout=${FEIGN_READ_TIMEOUT_MS:5000}
spring.cloud.openfeign.client.config.default.defaultRequestHeaders.X-Consulta-Fresca=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Validación local de JWT y autenticación para llamadas internas.
ticketya.jwt.public-key=${JWT_PUBLIC_KEY:file:../.secrets/jwt-public.pem}
ticketya.jwt.issuer=${JWT_ISSUER:ticketya-usuarios}
ticketya.jwt.audience=${JWT_AUDIENCE:ticketya-api}
ticketya.service.secret=${SERVICE_CLIENT_SECRET:}
ticketya.service.token-url=${SERVICE_TOKEN_URL:http://localhost:8085/auth/service-token}

# Comunicacion con Fila Virtual
msvc.fila-virtual.url=${FILA_VIRTUAL_URL:http://localhost:8088}

spring.cloud.openfeign.client.config.filaVirtualClient.connectTimeout=3000
spring.cloud.openfeign.client.config.filaVirtualClient.readTimeout=5000

# Procesamiento de finalizaciones de fila virtual
fila-virtual.finalizaciones.intervalo-ms=5000
fila-virtual.finalizaciones.reintento-segundos=10
