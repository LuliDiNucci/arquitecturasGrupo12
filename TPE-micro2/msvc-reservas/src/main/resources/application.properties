
# Nombre del microservicio
spring.application.name=msvc-reservas

# Puerto del microservicio Reservas
server.port=${PORT:8080}

# Conexion a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketya_reservas?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:${DB_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Limite de entradas por cliente
reservas.max-entradas-por-cliente=4

# Conexion con el microservicio Eventos y Lugares
msvc.eventos.url=${EVENTOS_URL:http://localhost:8081}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Validación local de JWT y autenticación para llamadas internas.
ticketya.jwt.public-key=${JWT_PUBLIC_KEY:file:../.secrets/jwt-public.pem}
ticketya.jwt.issuer=${JWT_ISSUER:ticketya-usuarios}
ticketya.jwt.audience=${JWT_AUDIENCE:ticketya-api}
ticketya.service.secret=${SERVICE_CLIENT_SECRET:}
ticketya.service.token-url=${SERVICE_TOKEN_URL:http://localhost:8085/auth/service-token}
