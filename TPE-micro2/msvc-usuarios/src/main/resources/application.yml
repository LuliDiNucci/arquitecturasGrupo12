server:
  port: ${PORT:8085}
spring:
  application:
    name: msvc-usuarios
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ticketya_usuarios}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
ticketya:
  jwt:
    issuer: ${JWT_ISSUER:ticketya-usuarios}
    audience: ${JWT_AUDIENCE:ticketya-api}
    public-key: ${JWT_PUBLIC_KEY:file:../.secrets/jwt-public.pem}
    private-key: ${JWT_PRIVATE_KEY:file:../.secrets/jwt-private.pem}
    ttl: ${JWT_TTL:PT60M}
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    window: ${LOGIN_WINDOW:PT15M}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  services:
    eventos: ${SERVICE_EVENTOS_SECRET:}
    reservas: ${SERVICE_RESERVAS_SECRET:}
    compras: ${SERVICE_COMPRAS_SECRET:}
    entradas: ${SERVICE_ENTRADAS_SECRET:}
