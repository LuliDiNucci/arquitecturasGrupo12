# Spring Boot 3.5 y 4.1 incluyen JSON Logstash sin un encoder adicional.
logging.structured.format.console=logstash
logging.structured.format.file=logstash
logging.structured.json.add.servicio=${spring.application.name}
logging.structured.json.exclude=stack_trace
logging.level.root=INFO
debug=false
logging.file.name=${TICKETYA_LOG_DIR:../logs}/${spring.application.name}.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
spring.jpa.show-sql=false
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.feign=INFO
